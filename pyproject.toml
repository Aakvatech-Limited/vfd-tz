[project]
name = "vfd_tz"
authors = [
    { name = "Aakvatech", email = "info@aakvatech.com" }
]
description = "VFD TZ"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "dicttoxml",
    "defusedxml",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
